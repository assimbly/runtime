apiVersion: "camel.apache.org/v1"
kind: "Kamelet"
metadata:
  name: "smtp-action"
  labels:
    camel.apache.org/kamelet.type: "action"
spec:
  definition:
    title: "smtp action"
    description: "SMTP (Simple Mail Transfer Protocol) SMTP is the standard protocol\
      \ for sending emails from one system to another."
    type: "object"
    properties:
      scheme:
        title: "scheme of components"
        description: "Endpoint URI"
        type: "string"
      path:
        title: "path"
        description: "path of component"
        type: "string"
        default: "dummy"
      username:
        title: "username smpt server"
        description: "username smpt server"
        type: "string"
        x-descriptors:
        - "urn:camel:group:credentials"
      password:
        title: "password of smtp server"
        description: "password of smtp server"
        type: "string"
        x-descriptors:
        - "urn:camel:group:credentials"
      from:
        title: "from email address"
        description: "from email address"
        type: "string"
      subject:
        title: "subject of email"
        description: "subject of email"
        type: "string"
      to:
        title: "to email address"
        description: "to email address"
        type: "string"
      replyTo:
        title: "replyTo email address"
        description: "replyTo email address"
        type: "string"
      in:
        title: "Source Endpoint"
        type: "string"
        default: "kamelet:source"
      out:
        title: "Sink Endpoint"
        type: "string"
        default: "mock:sink"
      sink:
        title: "Sink"
        type: "boolean"
        default: false
      routeId:
        title: "Route ID"
        type: "string"
      stepId:
        title: "Step ID"
        type: "string"
      routeConfigurationId:
        title: "Route Configuration ID"
        type: "string"
        default: "0"
      authenticator:
        title: "mail authenticator"
        description: "mail authenticator"
        type: "string"
      authMechanisms:
        title: "mail auth mechanisms"
        description: "SASL auth mechanisms"
        type: "string"
      authEnabled:
        title: "mail auth enabled"
        description: "Whether SASL auth is enabled"
        type: "boolean"
        default: false
  dependencies:
  - "camel:kamelet"
  template:
    route:
      routeConfigurationId: "{{routeConfigurationId}}"
      from:
        uri: "{{in}}"
        steps:
        - step:
            id: "step-{{stepId}}"
            steps:
            - toD:
                uri: "{{scheme}}:{{path}}"
                parameters:
                  username: "RAW({{username}})"
                  password: "RAW({{?password}})"
                  authenticator: "{{?authenticator}}"
                  from: "RAW({{?from}})"
                  to: "RAW({{to}})"
                  replyTo: "RAW({{?replyTo}})"
                  subject: "RAW({{subject}})"
                  mail.smtp.starttls.enable: true
                  mail.smtp.starttls.required: true
                  mail.smtp.auth.mechanisms: "{{?authMechanisms}}"
                  mail.smtp.auth: "{{authEnabled}}"
                  mail.smtp.sasl.enable: "{{authEnabled}}"
                  mail.smtp.sasl.mechanisms: "{{?authMechanisms}}"
            - to:
                disabled: "{{sink}}"
                uri: "{{out}}"
