apiVersion: "camel.apache.org/v1"
kind: "Kamelet"
metadata:
  name: "pulsar-action"
  labels:
    camel.apache.org/kamelet.type: "action"
spec:
  definition:
    title: "Pulsar Action"
    description: "Publish messages to an Apache Pulsar topic."
    required:
      - topicName
    type: "object"
    properties:
      persistence:
        title: "Persistence"
        description: "Whether the Pulsar topic is persistent or non-persistent."
        type: "string"
        enum: ["persistent", "non-persistent"]
        default: "persistent"
      tenant:
        title: "Tenant"
        description: "Pulsar tenant name."
        type: "string"
        default: "public"
      namespace:
        title: "Namespace"
        description: "Pulsar namespace name."
        type: "string"
        default: "default"
      topicName:
        title: "Topic Name"
        description: "Pulsar topic name."
        type: "string"
      serviceUrl:
        title: "Service URL"
        description: "Pulsar broker service URL (optional when configured via a DIL Pulsar connection)."
        type: "string"
        example: "pulsar://localhost:6650"
      authenticationClass:
        title: "Authentication Class"
        description: "Authentication plugin FQCN used when creating the Pulsar client from URI."
        type: "string"
      authenticationParams:
        title: "Authentication Params"
        description: "Authentication parameters used when creating the Pulsar client from URI."
        type: "string"
        format: "password"
        x-descriptors:
        - urn:camel:group:credentials
      producerName:
        title: "Producer Name"
        description: "Name of the producer (Pulsar assigns a unique name if unset)."
        type: "string"
      sendTimeoutMs:
        title: "Send Timeout (ms)"
        description: "Send timeout in milliseconds."
        type: "integer"
        default: 30000
      batchingEnabled:
        title: "Batching Enabled"
        description: "Enable automatic batching of outbound messages."
        type: "boolean"
        default: true
      batchingMaxMessages:
        title: "Batching Max Messages"
        description: "Maximum number of messages in a batch."
        type: "integer"
        default: 1000
      compressionType:
        title: "Compression Type"
        description: "Compression algorithm for outbound messages."
        type: "string"
        enum: ["NONE", "LZ4", "ZLIB", "ZSTD", "SNAPPY"]
        default: "NONE"
      blockIfQueueFull:
        title: "Block If Queue Full"
        description: "Block the producing thread when the pending message queue is full."
        type: "boolean"
        default: false
      maxPendingMessages:
        title: "Max Pending Messages"
        description: "Maximum size of the pending messages queue."
        type: "integer"
        default: 1000
      in:
        title: "Source Endpoint"
        type: "string"
        default: "kamelet:source"
      out:
        title: "Sink Endpoint"
        type: "string"
        default: "mock:sink"
      sink:
        title: "Sink"
        type: "boolean"
        default: false
      routeId:
        title: "Route ID"
        type: "string"
      stepId:
        title: "Step ID"
        type: "string"
      routeConfigurationId:
        title: "Route Configuration ID"
        type: "string"
        default: "0"
  types:
    in:
      mediaType: "application/octet-stream"
  dependencies:
    - "camel:pulsar"
    - "camel:kamelet"
    - "camel:core"
  template:
    route:
      routeConfigurationId: "{{routeConfigurationId}}"
      from:
        uri: "{{in}}"
        steps:
        - step:
            id: "step-{{stepId}}"
            steps:
            - to:
                uri: "pulsar:{{persistence}}://{{tenant}}/{{namespace}}/{{topicName}}"
                parameters:
                  serviceUrl: "{{?serviceUrl}}"
                  authenticationClass: "{{?authenticationClass}}"
                  authenticationParams: "{{?authenticationParams}}"
                  producerName: "{{?producerName}}"
                  sendTimeoutMs: "{{sendTimeoutMs}}"
                  batchingEnabled: "{{batchingEnabled}}"
                  batchingMaxMessages: "{{batchingMaxMessages}}"
                  compressionType: "{{compressionType}}"
                  blockIfQueueFull: "{{blockIfQueueFull}}"
                  maxPendingMessages: "{{maxPendingMessages}}"
            - to:
                disabled: "{{sink}}"
                uri: "{{out}}"
