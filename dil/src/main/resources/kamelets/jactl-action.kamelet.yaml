apiVersion: "camel.apache.org/v1"
kind: "Kamelet"
metadata:
  name: "jactl-action"
  labels:
    camel.apache.org/kamelet.type: "action"
spec:
  definition:
    title: "jactl action"
    description: "Apply jactl on a message"
    type: "object"
    properties:
      expression:
        title: "Expression"
        description: "Set the content of the body"
        type: "string"
        default: ""
      in:
        title: "Source Endpoint"
        type: "string"
        default: "kamelet:source"
      out:
        title: "Sink Endpoint"
        type: "string"
        default: "mock:sink"
      sink:
        title: "Sink"
        type: "boolean"
        default: false
      routeId:
        title: "Route ID"
        type: "string"
      stepId:
        title: "Step ID"
        type: "string"
      routeConfigurationId:
        title: "Route Configuration ID"
        type: "string"
        default: "0"
  dependencies:
  - "camel:kamelet"
  template:
    route:
      routeConfigurationId: "{{routeConfigurationId}}"
      from:
        uri: "{{in}}"
        steps:
        - step:
            id: "step-{{stepId}}"
            steps:
            - setBody:
                expression:
                  jactl:
                    expression: "{{expression}}"
            - to:
                disabled: "{{sink}}"
                uri: "{{out}}"