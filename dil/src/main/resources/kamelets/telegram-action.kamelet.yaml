apiVersion: "camel.apache.org/v1"
kind: "Kamelet"
metadata:
  name: "telegram-action"
  labels:
    camel.apache.org/kamelet.type: "action"
spec:
  definition:
    title: "Telegram Action"
    description: "Send messages to a Telegram chat."
    required:
      - authorizationToken
    type: "object"
    properties:
      authorizationToken:
        title: "Token"
        description: "Bot token obtained from Telegram @BotFather."
        type: "string"
        format: "password"
        x-descriptors:
        - urn:camel:group:credentials
      chatId:
        title: "Chat ID"
        description: "Default Chat ID to send messages to."
        type: "string"
      in:
        title: "Source Endpoint"
        type: "string"
        default: "kamelet:source"
      out:
        title: "Sink Endpoint"
        type: "string"
        default: "mock:sink"
      sink:
        title: "Sink"
        type: "boolean"
        default: false
      routeId:
        title: "Route ID"
        type: "string"
      stepId:
        title: "Step ID"
        type: "string"
      routeConfigurationId:
        title: "Route Configuration ID"
        type: "string"
        default: "0"
  types:
    out:
      mediaType: "application/json"
  dependencies:
    - "camel:core"
    - "camel:jackson"
    - "camel:kamelet"
    - "camel:telegram"
  template:
    route:
      routeConfigurationId: "{{routeConfigurationId}}"
      from:
        uri: "{{in}}"
        steps:
        - step:
            id: "step-{{stepId}}"
            steps:
            - choice:
                when:
                - simple: "${header[Content-Type]} == 'image/png'"
                  steps:
                  - convertBodyTo:
                      type: "byte[]"
                  - setHeader:
                      name: "CamelTelegramMediaType"
                      constant: "PHOTO_PNG"
                - simple: "${header[Content-Type]} == 'image/jpeg'"
                  steps:
                  - convertBodyTo:
                      type: "byte[]"
                  - setHeader:
                      name: "CamelTelegramMediaType"
                      constant: "PHOTO_JPG"
                otherwise:
                  steps:
                  - convertBodyTo:
                      type: "java.lang.String"
            - choice:
                when:
                - simple: "${header[text]}"
                  steps:
                  - setHeader:
                      name: "CamelTelegramMediaTitleCaption"
                      simple: "${header[text]}"
                - simple: "${header[ce-text]}"
                  steps:
                  - setHeader:
                      name: "CamelTelegramMediaTitleCaption"
                      simple: "${header[ce-text]}"
            - choice:
                when:
                - simple: "${header[chat-id]}"
                  steps:
                  - setHeader:
                      name: "CamelTelegramChatId"
                      simple: "${header[chat-id]}"
                - simple: "${header[ce-chatid]}"
                  steps:
                  - setHeader:
                      name: "CamelTelegramChatId"
                      simple: "${header[ce-chatid]}"
            - to:
                uri: "telegram:bots"
                parameters:
                  authorizationToken: "{{authorizationToken}}"
                  chatId: "{{?chatId}}"
            - marshal:
                json: {}
            - to:
                disabled: "{{sink}}"
                uri: "{{out}}"
