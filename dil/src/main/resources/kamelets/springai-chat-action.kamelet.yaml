apiVersion: "camel.apache.org/v1"
kind: "Kamelet"
metadata:
  name: "springai-chat-action"
  labels:
    camel.apache.org/kamelet.type: "action"

spec:
  definition:
    title: "Spring AI Chat Action"
    description: "Send a prompt to a Spring AI chat model and receive the AI response"
    type: "object"
    properties:
      in:
        type: "string"
        default: "kamelet:source"
      out:
        type: "string"
        default: "kamelet:sink"
      routeId:
        title: "Route ID"
        type: "string"
        default: "springai-chat"
      routeConfigurationId:
        title: "Route Configuration ID"
        type: "string"
        default: "0"
      chatModel:
        title: "Chat Model Bean Name"
        description: "Name of the Spring AI ChatModel bean in the Camel registry (e.g. #SpringAiChatModel)"
        type: "string"
        default: "#SpringAiChatModel"
      chatMemory:
        title: "Chat Memory Bean Name"
        description: "Name of the Spring AI ChatMemory bean in the Camel registry (e.g. #SpringAiChatMemory)"
        type: "string"
      vectorStore:
        title: "Vector Store Bean Name"
        description: "Name of the Spring AI VectorStore bean in the Camel registry (e.g. #vectorStore)"
        type: "string"
      topK:
        title: "Top K"
        description: "Number of similar documents to retrieve"
        type: "integer"
      similarityThreshold:
        title: "Similarity Threshold"
        description: "Similarity threshold to filter documents"
        type: "string"

  dependencies:
    - "camel:kamelet"
    - "camel:spring-ai"

  template:
    route:
      routeConfigurationId: "{{routeConfigurationId}}"
      from:
        uri: "{{in}}"
        steps:
          - step:
              id: "{{routeId}}"
              steps:
                - convertBodyTo:
                    type: String

                - to:
                    uri: "spring-ai-chat://{{routeId}}?chatModel={{chatModel}}&chatMemory={{?chatMemory}}&vectorStore={{?vectorStore}}&topK={{?topK}}&similarityThreshold={{?similarityThreshold}}"

                - to:
                    uri: "{{out}}"