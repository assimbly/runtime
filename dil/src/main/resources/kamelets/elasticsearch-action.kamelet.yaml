apiVersion: "camel.apache.org/v1"
kind: "Kamelet"
metadata:
  name: "elasticsearch-action"
  labels:
    camel.apache.org/kamelet.type: "action"
spec:
  definition:
    title: "ElasticSearch Action"
    description: "Store JSON data in ElasticSearch."
    required:
      - clusterName
      - hostAddresses
    type: "object"
    properties:
      user:
        title: "Username"
        description: "Username to connect to ElasticSearch."
        type: "string"
        x-descriptors:
        - urn:camel:group:credentials
      password:
        title: "Password"
        description: "Password to connect to ElasticSearch."
        type: "string"
        format: "password"
        x-descriptors:
        - urn:camel:group:credentials
      enableSSL:
        title: "Enable SSL"
        description: "Connect using SSL."
        type: "boolean"
        default: true
      hostAddresses:
        title: "Host Addresses"
        description: "Comma-separated list of remote transport addresses in ip:port format."
        type: "string"
        example: "quickstart-es-http:9200"
      clusterName:
        title: "ElasticSearch Cluster Name"
        description: "Name of the ElasticSearch cluster."
        type: "string"
        example: "quickstart"
      indexName:
        title: "Index in ElasticSearch"
        description: "Name of the ElasticSearch index."
        type: "string"
        example: "data"
      certificate:
        title: "Certificate"
        description: "Base64-encoded certificate for accessing the ElasticSearch cluster."
        type: "string"
      in:
        title: "Source Endpoint"
        type: "string"
        default: "kamelet:source"
      out:
        title: "Sink Endpoint"
        type: "string"
        default: "mock:sink"
      sink:
        title: "Sink"
        type: "boolean"
        default: false
      routeId:
        title: "Route ID"
        type: "string"
      stepId:
        title: "Step ID"
        type: "string"
      routeConfigurationId:
        title: "Route Configuration ID"
        type: "string"
        default: "0"
  types:
    out:
      mediaType: "text/plain"
    in:
      mediaType: "application/json"
  dependencies:
    - "camel:core"
    - "camel:jackson"
    - "camel:kamelet"
    - "camel:elasticsearch"
    - "camel:gson"
    - "camel:bean"
  template:
    beans:
      - name: "local-es"
        type: "#class:org.apache.camel.component.es.ElasticsearchComponent"
        properties:
          user: "{{?user}}"
          password: "{{?password}}"
    route:
      routeConfigurationId: "{{routeConfigurationId}}"
      from:
        uri: "{{in}}"
        steps:
        - step:
            id: "step-{{stepId}}"
            steps:
            - choice:
                when:
                - simple: "${header[indexId]}"
                  steps:
                  - setHeader:
                      name: "CamelElasticsearchIndexId"
                      simple: "${header[indexId]}"
                - simple: "${header[ce-indexid]}"
                  steps:
                  - setHeader:
                      name: "CamelElasticsearchIndexId"
                      simple: "${header[ce-indexid]}"
            - choice:
                when:
                - simple: "${header[indexName]}"
                  steps:
                  - setHeader:
                      name: "CamelElasticsearchIndexName"
                      simple: "${header[indexName]}"
                - simple: "${header[ce-indexname]}"
                  steps:
                  - setHeader:
                      name: "CamelElasticsearchIndexName"
                      simple: "${header[ce-indexname]}"
            - unmarshal:
                json: {}
            - to:
                uri: "{{local-es}}:{{clusterName}}"
                parameters:
                  operation: "INDEX"
                  hostAddresses: "{{hostAddresses}}"
                  enableSSL: "{{enableSSL}}"
                  indexName: "{{?indexName}}"
                  certificatePath: "base64:{{?certificate}}"
            - to:
                disabled: "{{sink}}"
                uri: "{{out}}"
