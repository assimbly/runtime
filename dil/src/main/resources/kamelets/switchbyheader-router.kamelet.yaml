apiVersion: "camel.apache.org/v1"
kind: "Kamelet"
metadata:
  name: "switchbyheader-router"
  labels:
    camel.apache.org/kamelet.type: "router"
spec:
  definition:
    title: "switchbyheader-router"
    description: "Routes a message to a destination by matching a message header value against literal case values. When transpiled from DIL with multiple cases, this router is generated as a Camel switch route."
    type: "object"
    properties:
      headerName:
        title: "Header Name"
        description: "Name of the header to match"
        type: "string"
      headerValue:
        title: "Header Value"
        description: "Literal header value to match"
        type: "string"
      out_default:
        title: "Out Default Endpoint"
        description: "Default endpoint when no case matches"
        type: "string"
        default: "mock:0"
      in:
        title: "Source Endpoint"
        type: "string"
        default: "kamelet:source"
      out:
        title: "Sink Endpoint"
        type: "string"
        default: "mock:sink"
      routeId:
        title: "Route ID"
        type: "string"
      stepId:
        title: "Step ID"
        type: "string"
      routeConfigurationId:
        title: "Route Configuration ID"
        type: "string"
        default: "0"
  dependencies:
    - "camel:kamelet"
  template:
    route:
      routeConfigurationId: "{{routeConfigurationId}}"
      from:
        uri: "{{in}}"
        steps:
          - step:
              id: "step-{{stepId}}"
              steps:
                - switch:
                    selector:
                      header:
                        expression: "{{headerName}}"
                    case:
                      - value: "{{headerValue}}"
                        uri: "{{out}}"
                    otherwise:
                      uri: "{{out_default}}"
