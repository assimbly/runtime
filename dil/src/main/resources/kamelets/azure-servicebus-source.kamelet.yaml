apiVersion: "camel.apache.org/v1"
kind: "Kamelet"
metadata:
  name: "azure-servicebus-source"
  labels:
    camel.apache.org/kamelet.type: "source"
spec:
  definition:
    title: "Azure ServiceBus Source"
    description: "Consume messages from Azure ServiceBus."
    required:
      - topicOrQueueName
      - connectionString
    type: "object"
    properties:
      topicOrQueueName:
        title: "Topic Or Queue Name"
        description: "Topic or queue name for Azure ServiceBus."
        type: "string"
      connectionString:
        title: "Connection String"
        description: "Connection string for Azure ServiceBus."
        type: "string"
        format: "password"
        x-descriptors:
        - urn:camel:group:credentials
      serviceBusReceiveMode:
        title: "ServiceBus Receive Mode"
        description: "Receive mode for the receiver."
        type: "string"
        default: "PEEK_LOCK"
        enum: ["PEEK_LOCK", "RECEIVE_AND_DELETE"]
      subscriptionName:
        title: "Subscription Name"
        description: "Subscription name in the topic (required for topics)."
        type: "string"
      serviceBusType:
        title: "ServiceBus Type"
        description: "ServiceBus entity type (queue or topic)."
        type: "string"
        default: "queue"
        enum: ["queue", "topic"]
      credentialType:
        title: "Credential Type"
        description: "Credential strategy to use."
        type: "string"
        enum: ["AZURE_IDENTITY", "CONNECTION_STRING", "TOKEN_CREDENTIAL"]
        default: "CONNECTION_STRING"
      in:
        title: "Source Endpoint"
        type: "string"
        default: "kamelet:source"
      out:
        title: "Sink Endpoint"
        type: "string"
        default: "mock:sink"
      routeId:
        title: "Route ID"
        type: "string"
      stepId:
        title: "Step ID"
        type: "string"
      routeConfigurationId:
        title: "Route Configuration ID"
        type: "string"
        default: "0"
  types:
    out:
      mediaType: "application/octet-stream"
  dependencies:
    - "camel:azure-servicebus"
    - "camel:kamelet"
    - "camel:core"
  template:
    route:
      routeConfigurationId: "{{routeConfigurationId}}"
      from:
        uri: "azure-servicebus:{{topicOrQueueName}}"
        parameters:
          connectionString: "{{connectionString}}"
          serviceBusReceiveMode: "{{serviceBusReceiveMode}}"
          subscriptionName: "{{?subscriptionName}}"
          serviceBusType: "{{serviceBusType}}"
          credentialType: "{{credentialType}}"
        steps:
        - step:
            id: "step-{{stepId}}"
            steps:
            - setBody:
                simple: "${body.toBytes()}"
            - to:
                uri: "{{out}}"
