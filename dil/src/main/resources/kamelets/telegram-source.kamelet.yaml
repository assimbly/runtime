apiVersion: "camel.apache.org/v1"
kind: "Kamelet"
metadata:
  name: "telegram-source"
  labels:
    camel.apache.org/kamelet.type: "source"
spec:
  definition:
    title: "Telegram Source"
    description: "Receive messages sent to a Telegram bot."
    required:
      - authorizationToken
    type: "object"
    properties:
      authorizationToken:
        title: "Token"
        description: "Bot token obtained from Telegram @BotFather."
        type: "string"
        format: "password"
        x-descriptors:
        - urn:camel:group:credentials
      in:
        title: "Source Endpoint"
        type: "string"
        default: "kamelet:source"
      out:
        title: "Sink Endpoint"
        type: "string"
        default: "mock:sink"
      routeId:
        title: "Route ID"
        type: "string"
      stepId:
        title: "Step ID"
        type: "string"
      routeConfigurationId:
        title: "Route Configuration ID"
        type: "string"
        default: "0"
  types:
    out:
      mediaType: "application/json"
  dependencies:
    - "camel:jackson"
    - "camel:kamelet"
    - "camel:telegram"
    - "camel:core"
  template:
    route:
      routeConfigurationId: "{{routeConfigurationId}}"
      from:
        uri: "telegram:bots"
        parameters:
          authorizationToken: "{{authorizationToken}}"
        steps:
        - step:
            id: "step-{{stepId}}"
            steps:
            - setHeader:
                name: "chat-id"
                simple: "${header[CamelTelegramChatId]}"
            - setHeader:
                name: "ce-chatid"
                simple: "${header[CamelTelegramChatId]}"
            - marshal:
                json: {}
            - to:
                uri: "{{out}}"
