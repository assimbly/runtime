apiVersion: "camel.apache.org/v1"
kind: "Kamelet"
metadata:
  name: "javascript-script"
  labels:
    camel.apache.org/kamelet.type: "script"
spec:
  definition:
    title: "javascript script"
    description: "Sets the message body to the result of a JavaScript script"
    type: "object"
    properties:
      path:
        title: "Path"
        description: "The JavaScript script"
        type: "string"
      in:
        title: "Source Endpoint"
        type: "string"
        default: "kamelet:source"
      out:
        title: "Sink Endpoint"
        type: "string"
        default: "mock:sink"
      sink:
        title: "Sink"
        type: "boolean"
        default: false
      routeId:
        title: "Route ID"
        type: "string"
      stepId:
        title: "Step ID"
        type: "string"
      routeConfigurationId:
        title: "Route Configuration ID"
        type: "string"
        default: "0"
  dependencies:
  - "camel:kamelet"
  template:
    route:
      routeConfigurationId: "{{routeConfigurationId}}"
      from:
        uri: "{{in}}"
        steps:
        - step:
            id: "step-{{stepId}}"
            steps:
            - setBody:
                js: "{{path}}"
            - to:
                disabled: "{{sink}}"
                uri: "{{out}}"
