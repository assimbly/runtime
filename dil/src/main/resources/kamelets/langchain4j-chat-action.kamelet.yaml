apiVersion: "camel.apache.org/v1"
kind: "Kamelet"
metadata:
  name: "langchain4j-chat-action"
  labels:
    camel.apache.org/kamelet.type: "action"
spec:
  definition:
    title: "langchain4j-chat action"
    description: "chat component for langchain4j"
    type: "object"
    properties:
      path:
        title: "Path"
        description: "Path"
        type: "string"
      in:
        title: "Source Endpoint"
        type: "string"
        default: "kamelet:source"
      out:
        title: "Sink Endpoint"
        type: "string"
        default: "kamelet:sink"
      routeId:
        title: "Route ID"
        type: "string"
      routeConfigurationId:
        title: "Route Configuration ID"
        type: "string"
        default: "0"
      chatModel:
        title: "Chat Model Bean Name"
        type: "string"
        default: "#geminiChatModel"
  dependencies:
    - "camel:kamelet"
  template:
    route:
      routeConfigurationId: "{{routeConfigurationId}}"
      from:
        uri: "{{in}}"
        steps:
          - step:
              id: "{{routeId}}"
              steps:
                - convertBodyTo:
                    type: String
                - to:
                    uri: "langchain4j-chat://{{routeId}}?chatModel={{chatModel}}"
          - to:
              uri: "{{out}}"
