apiVersion: "camel.apache.org/v1"
kind: "Kamelet"
metadata:
  name: "binarytobase64-action"
  labels:
    camel.apache.org/kamelet.type: "action"
spec:
  definition:
    title: "binarytobase64 action"
    description: "Convert a binary body to a base64 encoded string"
    type: "object"
    properties:
      in:
        title: "Source Endpoint"
        type: "string"
        default: "kamelet:source"
      out:
        title: "Sink Endpoint"
        type: "string"
        default: "mock:sink"
      sink:
        title: "Sink"
        type: "boolean"
        default: false
      routeId:
        title: "Route ID"
        type: "string"
      stepId:
        title: "Step ID"
        type: "string"
      routeConfigurationId:
        title: "Route Configuration ID"
        type: "string"
        default: "0"
  dependencies:
  - "camel:kamelet"
  - "camel:base64"
  template:
    route:
      routeConfigurationId: "{{routeConfigurationId}}"
      from:
        uri: "{{in}}"
        steps:
        - step:
            id: "step-{{stepId}}"
            steps:
            - convertBodyTo:
                type: byte[]
            - marshal:
                base64: {}
            - to:
                disabled: "{{sink}}"
                uri: "{{out}}"
