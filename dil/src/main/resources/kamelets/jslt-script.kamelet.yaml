apiVersion: "camel.apache.org/v1"
kind: "Kamelet"
metadata:
  name: "jslt-script"
  labels:
    camel.apache.org/kamelet.type: "script"
spec:
  definition:
    title: "jslt script"
    description: "Apply a JSLT transformation on message"
    type: "object"
    properties:
      path:
        title: "Path"
        description: "The JSLT transformation, inline"
        type: "string"
      in:
        title: "Source Endpoint"
        type: "string"
        default: "kamelet:source"
      out:
        title: "Sink Endpoint"
        type: "string"
        default: "mock:sink"
      sink:
        title: "Sink"
        type: "boolean"
        default: false
      routeId:
        title: "Route ID"
        type: "string"
      stepId:
        title: "Step ID"
        type: "string"
      routeConfigurationId:
        title: "Route Configuration ID"
        type: "string"
        default: "0"
  dependencies:
  - "camel:kamelet"
  template:
    route:
      routeConfigurationId: "{{routeConfigurationId}}"
      from:
        uri: "{{in}}"
        steps:
        - step:
            id: "step-{{stepId}}"
            steps:
            - setHeader:
                name: "CamelJsltString"
                constant: "{{path}}"
            - to:
                uri: "jslt:script-{{stepId}}?allowTemplateFromHeader=true"
            - removeHeader:
                name: "CamelJsltString"
            - to:
                disabled: "{{sink}}"
                uri: "{{out}}"
