apiVersion: "camel.apache.org/v1"
kind: "Kamelet"
metadata:
  name: "langchain4jagent-action"
  labels:
    camel.apache.org/kamelet.type: "action"

spec:
  definition:
    title: "langchain4jagent action"
    description: "agent component for langchain4j"
    type: "object"
    properties:
      in:
        title: "Source Endpoint"
        type: "string"
        default: "kamelet:source"
      out:
        title: "Sink Endpoint"
        type: "string"
        default: "kamelet:sink"
      sink:
        title: "Sink"
        type: "boolean"
        default: false
      routeId:
        title: "Route ID"
        type: "string"
      routeConfigurationId:
        title: "Route Configuration ID"
        type: "string"
        default: "0"
      agent:
        title: "Agent Bean Name"
        type: "string"
        default: "geminiAgent"
      memoryId:
        title: "Memory ID"
        description: "The memory ID to identify the conversation session. Can be a Camel Simple expression."
        type: "string"
        default: ""
      systemMessage:
        title: "System Message"
        description: "The system message / instructions for the AI Agent."
        type: "string"
        default: ""
      jsonSchema:
        title: "JSON Schema"
        description: "Inline JSON Schema string or header reference to constrain the Agent output"
        type: "string"
        default: ""

  dependencies:
    - "camel:kamelet"
    - "camel:langchain4j-agent"

  template:
    route:
      routeConfigurationId: "{{routeConfigurationId}}"
      from:
        uri: "{{in}}"
        steps:
          - step:
              id: "{{routeId}}"
              steps:
                - convertBodyTo:
                    type: String
                - choice:
                    when:
                      - simple: "'{{?memoryId}}' != ''"
                        steps:
                          - setHeader:
                              name: "CamelLangChain4jAgentMemoryId"
                              simple: "{{memoryId}}"
                    otherwise:
                      steps:
                        - setHeader:
                            name: "CamelLangChain4jAgentMemoryId"
                            simple: "${exchangeId}"
                - choice:
                    when:
                      - simple: "'{{?systemMessage}}' != ''"
                        steps:
                          - setHeader:
                              name: "CamelLangChain4jAgentSystemMessage"
                              constant: "{{systemMessage}}"
                          - choice:
                              when:
                                - simple: "${header.CamelLangChain4jAgentSystemMessage} startsWith 'BASE64:'"
                                  steps:
                                    - setHeader:
                                        name: "CamelLangChain4jAgentSystemMessage"
                                        groovy: "new String(java.util.Base64.getDecoder().decode(request.headers['CamelLangChain4jAgentSystemMessage'].substring(7)))"
                - setHeader:
                    name: "CamelLangChain4jAgentJsonSchema"
                    constant: "{{?jsonSchema}}"
                - choice:
                    when:
                      - simple: "${header.CamelLangChain4jAgentJsonSchema} != ''"
                        steps:
                          - choice:
                              when:
                                - simple: "${header.CamelLangChain4jAgentJsonSchema} startsWith 'BASE64:'"
                                  steps:
                                    - setHeader:
                                        name: "CamelLangChain4jAgentJsonSchema"
                                        groovy: "new String(java.util.Base64.getDecoder().decode(request.headers['CamelLangChain4jAgentJsonSchema'].substring(7)))"
                          - choice:
                              when:
                                - simple: "${header.CamelLangChain4jAgentSystemMessage} != null && ${header.CamelLangChain4jAgentSystemMessage} != ''"
                                  steps:
                                    - setHeader:
                                        name: "CamelLangChain4jAgentSystemMessage"
                                        simple: "${header.CamelLangChain4jAgentSystemMessage}\n\nIMPORTANT: You MUST respond ONLY with a valid JSON object matching the requested JSON Schema. Do NOT wrap the JSON in markdown code blocks or add extra explanations."
                              otherwise:
                                steps:
                                  - setHeader:
                                      name: "CamelLangChain4jAgentSystemMessage"
                                      constant: "IMPORTANT: You MUST respond ONLY with a valid JSON object matching the requested JSON Schema. Do NOT wrap the JSON in markdown code blocks or add extra explanations."
                - to:
                    uri: "langchain4j-agent://{{routeId}}?agent=#{{agent}}"
          - to:
              disabled: "{{sink}}"
              uri: "{{out}}"
