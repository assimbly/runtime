apiVersion: "camel.apache.org/v1"
kind: "Kamelet"
metadata:
  name: "datasonnet-action"
  labels:
    camel.apache.org/kamelet.type: "action"
spec:
  definition:
    title: "datasonnet action"
    description: "Sets the body of message by a datasonnet expression"
    type: "object"
    properties:
      expression:
        title: "Datasonnet Expression"
        description: "Set the content of the body"
        type: "string"
        default: ""
      bodyMediaType:
        title: "Body MediaType"
        description: "MediaType of the input message body"
        type: "string"
        default: "application/json"
      outputMediaType:
        title: "Output MediaType"
        description: "MediaType of the output message body"
        type: "string"
        default: "application/json"
      in:
        title: "Source Endpoint"
        type: "string"
        default: "kamelet:source"
      out:
        title: "Sink Endpoint"
        type: "string"
        default: "mock:sink"
      sink:
        title: "Sink"
        type: "boolean"
        default: false
      routeId:
        title: "Route ID"
        type: "string"
      stepId:
        title: "Step ID"
        type: "string"
      routeConfigurationId:
        title: "Route Configuration ID"
        type: "string"
        default: "0"
  dependencies:
  - "camel:kamelet"
  template:
    route:
      routeConfigurationId: "{{routeConfigurationId}}"
      from:
        uri: "{{in}}"
        steps:
        - step:
            id: "step-{{stepId}}"
            steps:
            - convertBodyTo:
                type: "java.lang.String"
            - setBody:
                expression:
                  datasonnet:
                    expression: "{{expression}}"
                    bodyMediaType: "{{bodyMediaType}}"
                    outputMediaType: "{{outputMediaType}}"
                    resultType: "java.lang.String"
            - to:
                disabled: "{{sink}}"
                uri: "{{out}}"