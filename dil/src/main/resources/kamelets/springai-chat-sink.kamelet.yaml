apiVersion: "camel.apache.org/v1"
kind: "Kamelet"
metadata:
  name: "springai-chat-sink"
  labels:
    camel.apache.org/kamelet.type: "sink"

spec:
  definition:
    title: "Spring AI Chat Sink"
    description: "Send a prompt to a Spring AI chat model and receive the AI response"
    type: "object"
    properties:
      in:
        type: "string"
        default: "kamelet:source"
      routeId:
        title: "Route ID"
        type: "string"
        default: "springai-chat"
      routeConfigurationId:
        title: "Route Configuration ID"
        type: "string"
        default: "0"
      chatModel:
        title: "Chat Model Bean Name"
        description: "Name of the Spring AI ChatModel bean in the Camel registry (e.g. #SpringAiChatModel)"
        type: "string"
        default: "#SpringAiChatModel"

  dependencies:
    - "camel:kamelet"
    - "camel:spring-ai"

  template:
    route:
      routeConfigurationId: "{{routeConfigurationId}}"
      from:
        uri: "{{in}}"
        steps:
          - step:
              id: "{{routeId}}"
              steps:
                - convertBodyTo:
                    type: String
                - to:
                    uri: "spring-ai-chat://{{routeId}}?chatModel={{chatModel}}"
