apiVersion: "camel.apache.org/v1"
kind: "Kamelet"
metadata:
  name: "slack-action"
  labels:
    camel.apache.org/kamelet.type: "action"
spec:
  definition:
    title: "Slack Action"
    description: "Send messages to a Slack channel."
    required:
      - channel
      - webhookUrl
    type: "object"
    properties:
      channel:
        title: "Channel"
        description: "Slack channel to send messages to."
        type: "string"
        example: "#myroom"
      webhookUrl:
        title: "Webhook URL"
        description: "Webhook URL for the Slack channel."
        type: "string"
        format: "password"
        x-descriptors:
        - urn:camel:group:credentials
      in:
        title: "Source Endpoint"
        type: "string"
        default: "kamelet:source"
      out:
        title: "Sink Endpoint"
        type: "string"
        default: "mock:sink"
      sink:
        title: "Sink"
        type: "boolean"
        default: false
      routeId:
        title: "Route ID"
        type: "string"
      stepId:
        title: "Step ID"
        type: "string"
      routeConfigurationId:
        title: "Route Configuration ID"
        type: "string"
        default: "0"
  types:
    out:
      mediaType: "application/json"
  dependencies:
    - "camel:jackson"
    - "camel:slack"
    - "camel:kamelet"
  template:
    route:
      routeConfigurationId: "{{routeConfigurationId}}"
      from:
        uri: "{{in}}"
        steps:
        - step:
            id: "step-{{stepId}}"
            steps:
            - to:
                uri: "slack:{{channel}}"
                parameters:
                  webhookUrl: "{{webhookUrl}}"
            - to:
                disabled: "{{sink}}"
                uri: "{{out}}"
