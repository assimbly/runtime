apiVersion: "camel.apache.org/v1"
kind: "Kamelet"
metadata:
  name: "azure-servicebus-action"
  labels:
    camel.apache.org/kamelet.type: "action"
spec:
  definition:
    title: "Azure ServiceBus Action"
    description: "Send messages to Azure ServiceBus."
    required:
      - topicOrQueueName
      - connectionString
    type: "object"
    properties:
      topicOrQueueName:
        title: "Topic Or Queue Name"
        description: "Topic or queue name for Azure ServiceBus."
        type: "string"
      connectionString:
        title: "Connection String"
        description: "Connection string for Azure ServiceBus."
        type: "string"
        format: "password"
        x-descriptors:
        - urn:camel:group:credentials
      serviceBusType:
        title: "ServiceBus Type"
        description: "ServiceBus entity type (queue or topic)."
        type: "string"
        default: "queue"
        enum: ["queue", "topic"]
      credentialType:
        title: "Credential Type"
        description: "Credential strategy to use."
        type: "string"
        enum: ["AZURE_IDENTITY", "CONNECTION_STRING", "TOKEN_CREDENTIAL"]
        default: "CONNECTION_STRING"
      in:
        title: "Source Endpoint"
        type: "string"
        default: "kamelet:source"
      out:
        title: "Sink Endpoint"
        type: "string"
        default: "mock:sink"
      sink:
        title: "Sink"
        type: "boolean"
        default: false
      routeId:
        title: "Route ID"
        type: "string"
      stepId:
        title: "Step ID"
        type: "string"
      routeConfigurationId:
        title: "Route Configuration ID"
        type: "string"
        default: "0"
  types:
    in:
      mediaType: "application/octet-stream"
  dependencies:
    - "camel:azure-servicebus"
    - "camel:kamelet"
    - "camel:core"
  template:
    route:
      routeConfigurationId: "{{routeConfigurationId}}"
      from:
        uri: "{{in}}"
        steps:
        - step:
            id: "step-{{stepId}}"
            steps:
            - to:
                uri: "azure-servicebus:{{topicOrQueueName}}"
                parameters:
                  connectionString: "{{connectionString}}"
                  serviceBusType: "{{serviceBusType}}"
                  producerOperation: "sendMessages"
                  credentialType: "{{credentialType}}"
            - to:
                disabled: "{{sink}}"
                uri: "{{out}}"
