apiVersion: "camel.apache.org/v1"
kind: "Kamelet"
metadata:
  name: "springaichat-action"
  labels:
    camel.apache.org/kamelet.type: "action"

spec:
  definition:
    title: "Spring AI Chat Action"
    description: "Send a prompt to a Spring AI chat model and receive the AI response"
    type: "object"
    properties:
      chatModel:
        title: "Chat Model Bean Name"
        description: "Name of the Spring AI ChatModel bean in the Camel registry (e.g. SpringAiChatModel)"
        type: "string"
        default: "SpringAiChatModel"
      memoryId:
        title: "Memory ID"
        description: "Conversation session identifier to activate chat memory. Can be a fixed value or a Camel Simple expression."
        type: "string"
        default: ""
      tags:
        title: "Tags"
        description: "Tags for discovering and calling Camel route tools (Spring AI Function Calling)"
        type: "string"
        default: ""
      in:
        type: "string"
        default: "kamelet:source"
      out:
        type: "string"
        default: "kamelet:sink"
      sink:
        title: "Sink"
        type: "boolean"
        default: false
      routeId:
        title: "Route ID"
        type: "string"
        default: "springai-chat"
      routeConfigurationId:
        title: "Route Configuration ID"
        type: "string"
        default: "0"

  dependencies:
    - "camel:kamelet"
    - "camel:spring-ai"

  template:
    route:
      routeConfigurationId: "{{routeConfigurationId}}"
      from:
        uri: "{{in}}"
        steps:
          - step:
              id: "{{routeId}}"
              steps:
                - convertBodyTo:
                    type: String
                - choice:
                    when:
                      - simple: "'{{?memoryId}}' != ''"
                        steps:
                          - setHeader:
                              name: "CamelSpringAiChatConversationId"
                              simple: "{{?memoryId}}"
                    otherwise:
                      steps:
                        - choice:
                            when:
                              - simple: "${header.memoryId} != null"
                                steps:
                                  - setHeader:
                                      name: "CamelSpringAiChatConversationId"
                                      simple: "${header.memoryId}"
                            otherwise:
                              steps:
                                - setHeader:
                                    name: "CamelSpringAiChatConversationId"
                                    simple: "default"
                - to:
                    uri: "spring-ai-chat://{{routeId}}?chatModel=#{{chatModel}}&chatMemory=#{{chatModel}}-memory&tags={{?tags}}"
          - to:
              disabled: "{{sink}}"
              uri: "{{out}}"