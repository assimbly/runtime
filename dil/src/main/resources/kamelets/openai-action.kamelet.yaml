apiVersion: "camel.apache.org/v1"
kind: "Kamelet"
metadata:
  name: "openai-action"
  labels:
    camel.apache.org/kamelet.type: "action"
spec:
  definition:
    title: "OpenAI Action"
    type: "object"
    properties:
      operation:
        type: "string"
        default: "chat-completion"
      apiKey:
        type: "string"
        format: "password"
        x-descriptors:
          - "urn:camel:group:credentials"
      conversationMemory:
        type: "boolean"
        default: true
      model:
        type: "string"
        default: "gpt-4o-mini"
      systemMessage:
        type: "string"
        default: ""
      in:
        type: "string"
        default: "kamelet:source"
      out:
        type: "string"
        default: "mock:sink"
      sink:
        title: "Sink"
        type: "boolean"
        default: false
      routeId:
        title: "Route ID"
        type: "string"
      stepId:
        title: "Step ID"
        type: "string"
      routeConfigurationId:
        type: "string"
        default: "0"
  template:
    route:
      routeConfigurationId: "{{routeConfigurationId}}"
      from:
        uri: "{{in}}"
        steps:
          - step:
              id: "step-{{stepId}}"
              steps:
                - to:
                    uri: "openai:{{operation}}"
                    parameters:
                      apiKey: "{{apiKey}}"
                      conversationMemory: "{{conversationMemory}}"
                      model: "{{model}}"
                      systemMessage: "{{?systemMessage}}"
          - to:
              disabled: "{{sink}}"
              uri: "{{out}}"
