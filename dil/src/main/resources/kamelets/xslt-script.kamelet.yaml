apiVersion: "camel.apache.org/v1"
kind: "Kamelet"
metadata:
  name: "xslt-script"
  labels:
    camel.apache.org/kamelet.type: "script"
spec:
  definition:
    title: "xslt script"
    description: "Apply XSLT on message"
    type: "object"
    properties:
      path:
        title: "Path"
        description: "The XSLT stylesheet, inline"
        type: "string"
      in:
        title: "Source Endpoint"
        type: "string"
        default: "kamelet:source"
      out:
        title: "Sink Endpoint"
        type: "string"
        default: "mock:sink"
      sink:
        title: "Sink"
        type: "boolean"
        default: false
      routeId:
        title: "Route ID"
        type: "string"
      stepId:
        title: "Step ID"
        type: "string"
      routeConfigurationId:
        title: "Route Configuration ID"
        type: "string"
        default: "0"
  dependencies:
  - "camel:kamelet"
  template:
    route:
      routeConfigurationId: "{{routeConfigurationId}}"
      from:
        uri: "{{in}}"
        steps:
        - step:
            id: "step-{{stepId}}"
            steps:
            - setHeader:
                name: "CamelXsltStylesheet"
                constant: "{{path}}"
            - to:
                uri: "xslt-saxon:xslt/script-placeholder.xsl?allowTemplateFromHeader=true&saxonExtensionFunctions=#uuid-function"
            - removeHeader:
                name: "CamelXsltStylesheet"
            - to:
                disabled: "{{sink}}"
                uri: "{{out}}"
