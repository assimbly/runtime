name: Release Daily Next App Snapshot

on:
  workflow_dispatch:

jobs:
  getversion:
    runs-on: ubuntu-latest
    outputs:
      milestone: "${{ steps.maven-version.outputs.milestone }}"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: next-app

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Get Maven Project Version
        id: maven-version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)         
          echo "Maven version: $VERSION"
          echo "milestone=$VERSION" >> $GITHUB_OUTPUT

  call-release:
    needs: getversion 
    uses: ./.github/workflows/release-next-app.yml
    secrets: inherit
    with:
      branch: 'next-app'
      milestone: ${{needs.getversion.outputs.milestone}}
