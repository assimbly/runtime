name: Test

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to use'
        type: string
        default: 'develop'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout the code
        uses: actions/checkout@v7
        with:
          repository: "assimbly/runtime"
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}


      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Maven settings.xml
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <activeProfiles>
              <activeProfile>github</activeProfile>
            </activeProfiles>
            <profiles>
              <profile>
                <id>github</id>
                <repositories>
                  <repository>
                    <id>maven</id>
                    <name>Maven Central</name>
                    <url>https://repo1.maven.org/maven2</url>
                  </repository>
                  <repository>
                    <id>github</id>
                    <name>Assimbly Base Repository</name>
                    <url>https://maven.pkg.github.com/assimbly/base</url>
                    <snapshots>
                      <enabled>true</enabled>
                    </snapshots>
                  </repository>
                  <repository>
                    <id>aurea</id>
                    <name>Aurea Sonic Repository</name>
                    <url>https://int-factory.aurea.com/nexus/content/repositories/sonic-releases/</url>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <servers>
              <server>
                <id>github</id>
                <username>assimbly</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Test project
        run: mvn test
        env:
          GITHUB_TOKEN: ${{ secrets.MAVEN_TOKEN }}

      - name: Post a Slack message in the backend dev channel
        if: failure()
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_BACKEND_DEV }}
          webhook-type: incoming-webhook
          payload: |
            text: ":x: Runtime Test failed: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}>"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: ":x: Runtime Test failed: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}>"

