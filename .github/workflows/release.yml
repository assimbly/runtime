name: Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to use'
        type: string
        default: 'develop'
      milestone:
        description: 'Milestone to use as version'
        type: string
        required: true

  workflow_call:
    inputs:
      branch:
        description: 'Branch to use'
        type: string
        default: 'develop'
      milestone:
        description: 'Milestone to use as version'
        type: string
        required: true

jobs:
  delete_old_snapshots:

    runs-on: ubuntu-latest
    permissions:
        contents: read
        packages: write

    steps:

      - name: Delete older snapshots
        uses: smartsquaregmbh/delete-old-packages@v1.0.0
        with:
          organization: assimbly
          type: maven
          token: ${{ secrets.MAVEN_TOKEN }}
          keep: 0
          version-pattern: "${{inputs.milestone}}"
          names: |
            org.assimbly.runtime
            org.assimbly.dil
            org.assimbly.broker
            org.assimbly.broker-rest
            org.assimbly.commons
            org.assimbly.integration
            org.assimbly.integration-rest

  release-jars:
    needs: delete_old_snapshots
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout the code
        uses: actions/checkout@v7
        with:
          repository: "assimbly/runtime"
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}


      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Maven settings.xml
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <activeProfiles>
              <activeProfile>github</activeProfile>
            </activeProfiles>
            <profiles>
              <profile>
                <id>github</id>
                <repositories>
                  <repository>
                    <id>maven</id>
                    <name>Maven Central</name>
                    <url>https://repo1.maven.org/maven2</url>
                  </repository>
                  <repository>
                    <id>github</id>
                    <name>Assimbly Base Repository</name>
                    <url>https://maven.pkg.github.com/assimbly/base</url>
                    <snapshots>
                      <enabled>true</enabled>
                    </snapshots>
                  </repository>
                  <repository>
                    <id>aurea</id>
                    <name>Aurea Sonic Repository</name>
                    <url>https://int-factory.aurea.com/nexus/content/repositories/sonic-releases/</url>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <servers>
              <server>
                <id>github</id>
                <username>assimbly</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Publish package
        run: mvn --batch-mode deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.MAVEN_TOKEN }}

